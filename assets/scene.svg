<!-- 조수석 앞 테이블 — 어디가지 홈의 은유.
     "차 안에서, 내 자리에서 찾는다". 오빠 요구 "나 중심에서 알려주면 되잖아" 를 그림으로 옮긴 것.

     이 파일은 원본 보관용이다. 실제로는 index.html 에 인라인으로 들어간다 —
     stroke 가 currentColor 라서 다크/라이트 테마를 그대로 따라와야 하기 때문이다.
     래스터(PNG)로 만들면 흰 배경이 다크모드에서 튄다.

     🚫 오브제를 씬 위에 % 좌표로 박고 그 자리에 입력칸을 얹는 방식은 쓰지 않는다.
        375px 화면에서 노트 폭이 105px 이 되어 글을 못 쓴다(2026-08-09 설계 중 확인).
        은유는 "히어로 한 장 + 컨트롤 안의 손그림 아이콘" 으로 나눠서 싣는다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 132" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  <defs>
    <!-- 자로 잰 선은 손그림으로 안 읽힌다. 아주 살짝만 흔든다. -->
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#sk)">
    <!-- 앞유리 -->
    <path d="M10 104 C 52 20, 348 20, 390 104" opacity=".85"/>
    <path d="M26 88 C 66 36, 334 36, 374 88" opacity=".22"/>

    <!-- 멀리 능선 — 어디론가 가는 중이라는 신호 -->
    <path d="M44 84 l30-14 26 10 34-16 28 13 26-10 30 14 28-9 26 12" opacity=".3"/>
    <!-- 길이 앞유리 아래로 흘러 들어온다 -->
    <path d="M176 104 l16-30 M224 104 l-16-30" opacity=".3"/>
    <path d="M200 78 v-8 M200 62 v-6" opacity=".25"/>

    <!-- 대시보드 상판 — 아래 컨트롤들이 이 위에 놓인 것으로 읽힌다 -->
    <path d="M0 132 L0 112 C 100 100, 300 100, 400 112 L400 132" opacity=".8"/>
    <path d="M0 121 C 100 110, 300 110, 400 121" opacity=".25"/>
  </g>
</svg>
